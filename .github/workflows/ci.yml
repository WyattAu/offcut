name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: compose config parses
        run: docker compose config --quiet

  frontend-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          working-directory: frontend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: build (prisma generate + next build)
        working-directory: frontend
        run: pnpm build

  rust-tokencount:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: offcut-tokencount (simd-tokenizer pin)
        working-directory: rust/offcut-tokencount
        run: cargo build && echo '{"s":1}' | ./target/debug/offcut-tokencount
