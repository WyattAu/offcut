[package]
name = "offcut-cut"
version = "0.1.0"
edition = "2021"
description = "Render worker for offcut clip cutting; pins worker-kit (job supervisor) + shutdown-kit"
license = "MIT"
authors = ["WyattAu"]
publish = false

[dependencies]
worker-kit = "0.3"
shutdown-kit = "0.3"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
